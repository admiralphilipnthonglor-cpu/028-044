
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login System | 042-044</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101827, #243b55);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .logo {
            width: 75px;
            height: 75px;
            background: #243b55;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #243b55;
            box-shadow: 0 0 5px rgba(36,59,85,0.2);
        }

        .remember {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .remember label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            margin: 0;
        }

        .remember input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #243b55;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #365879;
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 12px;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #e8f5e9;
            color: #26723b;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">IT</div>

        <h1>เข้าสู่ระบบ</h1>

        <p class="subtitle">
            ยินดีต้อนรับเข้าสู่ระบบสมาชิก
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">ชื่อผู้ใช้</label>
                <input
                    type="text"
                    id="username"
                    placeholder="กรอกชื่อผู้ใช้"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input
                    type="password"
                    id="password"
                    placeholder="กรอกรหัสผ่าน"
                    required
                >
            </div>

            <div class="remember">
                <label>
                    <input type="checkbox">
                    จดจำฉันไว้
                </label>
                <span>Login System</span>
            </div>

            <button type="submit">
                เข้าสู่ระบบ
            </button>

            <div class="message" id="message">
                ส่งข้อมูลตัวอย่างเรียบร้อยแล้ว
            </div>

        </form>

        <div class="footer">
            © 2026 Project Group 042-044
            <br><br>
            GitHub Teamwork Project
        </div>

    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                document.getElementById("message").style.display = "block";

            });
    </script>

</body>
</html>
